    <!-- Early Theme Sync from localStorage -->
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('theme');
          if (!storedTheme) {
            var appTheme = localStorage.getItem('fibd_app_state_v1_theme');
            if (appTheme) storedTheme = JSON.parse(appTheme);
          }
          var resolved = storedTheme === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
